<!DOCTYPE html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Stronghold layer — sign in</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#E7EBEF;font:500 15px/1.5 'Manrope','Segoe UI',system-ui,sans-serif;color:#15202B}@media(prefers-color-scheme:dark){body{background:#0F151C;color:#E6EBF0}.box{background:#182029!important;border-color:#2A3642!important}input{background:#0F151C!important;color:#E6EBF0!important;border-color:#3C4B5A!important}}
.box{background:#fff;border:1px solid #CFD7DF;border-radius:16px;padding:28px;width:min(92vw,380px)}h1{font-size:20px;margin:0 0 4px}p{color:#5C6B7A;margin:0 0 16px;font-size:13.5px}input{width:100%;padding:12px;border:1px solid #A9B5C1;border-radius:10px;font:inherit;font-size:16px;margin-bottom:10px;box-sizing:border-box}button{width:100%;padding:12px;border:0;border-radius:10px;background:#1F3A5F;color:#fff;font:inherit;font-weight:700;cursor:pointer}.err{color:#C8402E;font-size:13px;min-height:18px;margin-bottom:6px}</style></head>
<body><form class="box" id="f"><h1>Stronghold layer</h1><p>Workflow canvas and run logs. Owner and office only.</p><input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus><div class="err" id="err"></div><button>Sign in</button></form>
<script>document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});const d=await r.json().catch(()=>({}));if(r.ok)location.href='/';else document.getElementById('err').textContent=d.error||'Could not sign in';});</script></body></html>
